[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "herama"
version = "0.1.0"
description = "Local LLM backend — Ollama-compatible API with llama-cpp-python"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "llama-cpp-python>=0.2.80",
    "psutil>=5.9",
    "rich>=13.0",
    "requests>=2.31",
    "huggingface_hub>=0.23",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.535"]
dev = ["pytest>=8.0", "httpx"]

[project.scripts]
herama = "app.main:main"
herama-ui = "app.cli_ui:main"
herama-gui = "app.gui_ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
